[workspace]
members = ["crates/mise-core", "crates/mise-hub"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
mise-core = { path = "crates/mise-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
tempfile = "3"
